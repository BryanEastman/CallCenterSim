default_environment: dev
project_id: 01a1df53-5640-754e-a3b9-e792ff8c92fc
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-dbt
    variant: meltanolabs
    pip_url: tap-dbt
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      add_metadata_columns: true
      csv_files_definition: ./config/csv_files_definition.json
  loaders:
  - name: target-duckdb
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/target-duckdb.git
    config:
      add_metadata_columns: true
      database: CallCenterDB
      default_target_schema: bronze
      hard_delete: true
      temp_dir: ${MELTANO_PROJECT_ROOT}/output/temp
      filepath: ${MELTANO_PROJECT_ROOT}/output/CallCenterDB.duckdb
      primary_key_required: false
  utilities:
  - name: dbt-duckdb
    variant: jwills
    pip_url: dbt-core dbt-duckdb meltano-dbt-ext~=0.5.0
    config:
      path: ${MELTANO_PROJECT_ROOT}/output/CallCenterDB.duckdb
      schema: silver
