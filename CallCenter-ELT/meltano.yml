default_environment: dev
project_id: 01a1df53-5640-754e-a3b9-e792ff8c92fc
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-dbt
    variant: meltanolabs
    pip_url: tap-dbt
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      add_metadata_columns: true
      csv_files_definition: ./config/csv_files_definition.json
  loaders:
  - name: target-duckdb
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/target-duckdb.git
  utilities:
  - name: dbt-duckdb
    variant: jwills
    pip_url: dbt-core dbt-duckdb meltano-dbt-ext~=0.5.0
  - name: superset
    variant: meltano
    pip_url: apache-superset==3.1.1 flask==2.2.5 werkzeug==2.3.3 jinja2==3.0.1 wtforms==2.3.3 git+https://github.com/meltano/superset-ext.git@main cryptography==41.0.2
